<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>松鼠大战 · 怀旧单机复刻版</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/classic.css">
<link rel="stylesheet" href="css/classic-extras.css">
<link rel="stylesheet" href="css/classic-fusion.css">
<link rel="stylesheet" href="css/debug.css">
<link rel="stylesheet" href="css/battle-drops.css">
<link rel="stylesheet" href="css/classic-refine.css">
<link rel="stylesheet" href="css/tower.css">
<script>
// 运行时错误收集（供自检模式 ?test=1 报告问题，不影响正常游戏）
window.__errs = [];
window.addEventListener('error', function (e) {
  window.__errs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0));
});
window.addEventListener('unhandledrejection', function (e) {
  window.__errs.push('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
});
</script>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <div id="boot-note">初始化…</div>
</div>
<!-- 原版数据（武器/技能/道具字典 + 素材清单 + 动画帧表）：
     由 tools/gen-vendor-data.cjs 从 references/orig/ 抽取生成，
     运行时只加载这一份，游戏中不再引用 references/ 下的任何文件 -->
<script src="js/gamedict.js"></script>
<!-- 复刻版代码 -->
<script src="js/engine.js"></script>
<script src="js/gamedata.js"></script>
<script src="js/tower-data.js"></script>
<script src="js/state.js"></script>
<!-- 桌面外壳（Tauri）里把存档通道换成 Rust 端文件读写；网页版这一句什么都不做 -->
<script src="js/tauri-bridge.js"></script>
<script src="js/sim.js"></script>
<script src="js/tower.js"></script>
<script src="js/battle.js"></script>
<script src="js/battle-drops.js"></script>
<script src="js/ui.js"></script>
<script src="js/classic-ui.js"></script>
<script src="js/classic-extras.js"></script>
<script src="js/classic-fusion.js"></script>
<script src="js/tower-ui.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
</body>
</html>

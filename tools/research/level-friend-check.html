<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="/">
<meta charset="UTF-8">
<title>满级 / 礼包 / 师徒等级 / 好友检查</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/classic.css">
<link rel="stylesheet" href="css/classic-extras.css">
<link rel="stylesheet" href="css/classic-fusion.css">
<link rel="stylesheet" href="css/debug.css">
<link rel="stylesheet" href="css/battle-drops.css">
<link rel="stylesheet" href="css/classic-refine.css">
<script>
window.__errs = [];
window.addEventListener('error', function (e) { window.__errs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0)); });
window.addEventListener('unhandledrejection', function (e) { window.__errs.push('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
</script>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <div id="boot-note">初始化…</div>
</div>
<script src="js/orig/Map.min.js"></script>
<script src="js/orig/GameDict.js"></script>
<script src="js/orig/animationStr.js"></script>
<script src="js/orig/assets.js"></script>
<script src="js/orig/asset2.js"></script>
<script src="js/engine.js"></script>
<script src="js/gamedata.js"></script>
<script src="js/state.js"></script>
<script src="js/sim.js"></script>
<script src="js/battle-drops.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/classic-ui.js"></script>
<script src="js/classic-extras.js"></script>
<script src="js/classic-fusion.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
<script>
/* 1) 满级 70 级、满级体力上限 180
 * 2) 1/5/10/15/20 级礼包奖励加强
 * 3) 师徒随机等级不超过 70
 * 4) 好友系统：推荐随机 NPC、加/删好友、切磋、挑战页加好友
 * 结果在 window.__report.check。 */
(function () {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  window.addEventListener('load', async () => {
    document.title = 'LOADING';
    localStorage.removeItem('ssdz_debug');
    await wait(250);
    State.newGame('好友检查');
    const S = State.state();
    Main.showHome();
    await wait(400);
    const check = {};

    // ---------- 满级 / 体力上限 ----------
    check.caps = {
      maxLevel: State.MAX_PLAYER_LEVEL,
      curve: [1, 2, 3, 10, 20, 30, 69, 70].map((lv) => lv + ':' + State.energyCapForLevel(lv)),
      debugMax: Debug.MAX_LEVEL,
    };
    S.exp = 0; State.gainExp(1e9);
    check.maxed = { level: S.level, maxEnergy: S.maxEnergy };

    // ---------- 礼包加强 ----------
    check.gifts = {};
    for (const id of [28, 29, 30, 31, 32]) {
      const rows = State.state().props;
      const before = { gold: S.goldPoint, props: JSON.stringify(S.props) };
      const r = State.useProp(id);
      const boost = GData.giftPackPrize(id);
      const original = giftMap.getValue(id).prize;
      check.gifts[id] = {
        ok: r.ok,
        original: original,
        boosted: boost.map((b) => b.id + 'x' + b.count).join('|'),
        goldDelta: S.goldPoint - before.gold,
        msg: String(r.msg || '').slice(0, 90),
      };
    }

    // ---------- 师徒等级上限 ----------
    const RealNow = Date.now;
    S.level = 68;
    ClassicExtras.master();
    await wait(150);
    const masterLevels = [...document.querySelectorAll('.candidate-card .candidate-level')].slice(0, 3).map((e) => e.textContent.trim());
    S.level = 70;
    ClassicExtras.master();
    await wait(150);
    check.master = {
      at68: masterLevels,
      at70: [...document.querySelectorAll('.candidate-card .candidate-level')].map((e) => e.textContent.trim()),
      maxLevel: State.MAX_PLAYER_LEVEL,
    };

    // ---------- 好友 ----------
    UI.runAction('friends');
    await wait(200);
    const page = () => document.querySelector('.classic-page[data-screen="friends"]');
    check.friendPage = {
      recommends: page().querySelectorAll('.friend-row.recommend').length,
      rows: page().querySelectorAll('.friend-row').length,
      hasAddButton: !!page().querySelector('[data-friend-action="add"]'),
      hasRefresh: !!page().querySelector('[data-friend-action="refresh"]'),
      note: page().querySelector('.friend-note').textContent.trim(),
    };
    // 加一位推荐好友
    page().querySelector('[data-friend-action="add"]').click();
    await wait(200);
    check.added = {
      count: State.friendList().length,
      name: State.friendList()[0] && State.friendList()[0].name,
      level: State.friendList()[0] && State.friendList()[0].level,
      rows: page().querySelectorAll('.friend-row').length,
      listRows: page().querySelectorAll('.friend-list')[0].querySelectorAll('.friend-row').length,
      toast: Array.from(document.querySelectorAll('.toast')).map((t) => t.textContent).join(' / '),
      hasSpar: !!page().querySelector('[data-friend-action="spar"]'),
      recommendNowDisabled: page().querySelector('.friend-row.recommend .uc-button[disabled]') ? page().querySelector('.friend-row.recommend .uc-button[disabled]').textContent.trim() : null,
      addButtonsLeft: page().querySelectorAll('[data-friend-action="add"]').length,
    };
    // 重复添加同一位：推荐项已经变成「已是好友」，无法再点
    check.addAgain = { count: State.friendList().length, addButtons: page().querySelectorAll('[data-friend-action="add"]').length };
    check.dupApi = State.addFriend(State.friendList()[0]);
    // 切磋：不扣体力、不给奖励、也不产生「请点击」悬浮泡（等足第一次掉落的时间点）
    const energyBefore = S.energy, expBefore = S.exp, goldBefore = S.goldPoint;
    const sparBtn = page().querySelector('[data-friend-action="spar"]');
    sparBtn.click();
    await wait(2600);
    const battle = State.state().battles;
    check.spar = {
      bubbles: document.querySelectorAll('.battle-pickup').length,
      notice: document.querySelectorAll('.battle-pickup-notice').length,
      energy: S.energy - energyBefore,
      exp: S.exp - expBefore,
      gold: S.goldPoint - goldBefore,
    };
    // 结尾：删好友
    UI.runAction('friends');
    await wait(150);
    page().querySelector('[data-friend-action="drop"]').click();
    await wait(200);
    check.removed = { count: State.friendList().length, toast: (document.querySelector('.toast') || {}).textContent || '' };

    // 挑战页的「加好友」
    UI.runAction('challenge');
    await wait(200);
    document.querySelector('.classic-page[data-screen="challenge"] [data-foe="0"]').click();
    await wait(180);
    const chPage = document.activeElement && document.activeElement.closest ? document.activeElement.closest('.classic-page') : null;
    const chPage2 = document.querySelector('.classic-page[data-screen="challenge"]');
    const addFoe = chPage2.querySelector('[data-action="add-foe"]');
    check.challengeAdd = { hasButton: !!addFoe, foeName: addFoe ? 'yes' : null };
    if (addFoe) {
      addFoe.click();
      await wait(180);
      check.challengeAdd.count = State.friendList().length;
      check.challengeAdd.toast = Array.from(document.querySelectorAll('.toast')).map((t) => t.textContent).join(' / ');
      check.challengeAdd.before = State.friendList()[State.friendList().length - 1].name;
    }
    check.persist = (function () { State.save(); const n = State.friendList().length; State.load(); return { before: n, after: State.friendList().length, names: State.friendList().map((f) => f.name).join(',') }; })();

    check.errs = window.__errs;
    window.__report = { check, errs: window.__errs };
    document.title = 'READY';
  });
})();
</script>
</body>
</html>

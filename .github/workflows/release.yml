name: Release portable builds

# 打一个 v* 标签（例如 git tag v0.1.3 && git push origin v0.1.3）就会：
#   1. 把纯静态游戏打包成两个 zip（Mac 用 / Windows 用，内容一致，只是启动脚本不同）
#   2. 建一个 GitHub Release 并把 zip 挂上去，别人下载解压即玩
# 也可以手动触发（Actions → Release portable builds → Run workflow）。
#
# 注意：启动脚本不在本文件里现写，而是直接拷贝  下维护的那一份，
# 免得 workflow 与仓库里的脚本各写一套、越走越偏。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 组装两个平台的便携包
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="manual-$(date +%Y%m%d-%H%M)"; fi
          mkdir -p dist

          # 运行需要的文件（**就是仓库根那一套最小运行集合**；游戏里全是相对路径，没有绝对路径）
          COMMON="index.html css js images audio README.md serve.js serve.py 启动游戏.cmd 启动游戏.command 停止游戏.command 一键同步.cmd 一键同步.command 重启同步服务.cmd start-game.ps1"

          build() {          # $1 = 包名后缀（mac / win）
            name="squirrel-web-$1"
            out="dist/$name"
            rm -rf "$out"
            mkdir -p "$out"
            cp -R $COMMON "$out/"
            # 双机同步本体（零依赖）：入口脚本在仓库根，逻辑在 tools/sync/ 里
            mkdir -p "$out/tools/sync"
            cp -R tools/sync/sync.js tools/sync/sync-win.ps1 "$out/tools/sync/"
            chmod +x "$out/启动游戏.command" "$out/停止游戏.command" "$out/一键同步.command" "$out/serve.py" 2>/dev/null || true
            # Windows：.cmd 只是 ASCII 外壳，真正的逻辑在同目录的 .ps1 里
            # （cmd.exe 读 .cmd 里的 UTF-8 中文会把中文注释当命令，导致服务器起不来），
            # 而且 .cmd 必须是 CRLF，否则 if(...) 块与 goto 在部分环境下会出错。
            if [ "$1" = "win" ]; then
              for f in 启动游戏.cmd 一键同步.cmd 重启同步服务.cmd; do
                sed -i 's/\r$//' "$out/$f"
                sed -i 's/$/\r/' "$out/$f"
              done
            fi
            rm -f "$out/start-game.ps1.bak"
            cat > "$out/启动说明.txt" <<'TXT'
          松鼠大战怀旧复刻版 · 便携版
          ================================
          1) 解压整个文件夹（不要只把 index.html 拖出来：图片和音频都在 images/ 与 audio/ 里）
          2) 启动：
             · Windows：双击 启动游戏.cmd（同目录的 start-game.ps1 要一起留着，不能删）
             · macOS  ：双击 启动游戏.command
               首次请右键 → 打开；若提示没有权限，先在「终端」里执行 chmod +x 启动游戏.command
             启动器会起一个本地服务器，并用浏览器的「应用窗口」模式打开：没有标签栏、没有地址栏，
             看着就是一个独立窗口。想用普通标签页就加参数 --browser（例如 启动游戏.cmd --browser）。
             双击后命令行窗口会自己关掉：服务器在后台隐藏运行（日志在 save\server.out.log 与
             save\server.err.log），要停掉它就跑一次 启动游戏.cmd --stop
             （macOS 上是双击 停止游戏.command，或 bash 启动游戏.command --stop）。
             端口默认 8080；如果被别的程序占用，启动器会直接告诉你换一个，例如 启动游戏.cmd 8081。
          3) Node.js（https://nodejs.org，装 LTS 版即可）与 Python 3 有任意一个就行
             （serve.js / serve.py 就在这个文件夹里）；
             两个都没有时会直接打开 index.html —— 那种情况下浏览器不允许本地文件写盘，只能存浏览器里。

          存档：save/progress.json，就在解压出来的文件夹里，拷走这个文件等于备份了进度。
            没有服务器接口时自动退回浏览器 localStorage；游戏里「系统 → 存档位置」能看到当前是哪种模式。
            系统页里还能「从磁盘载入」一个导出的 .json 存档（macOS 原生窗口里也能弹出选择框）。

          两台电脑（Mac ↔ Windows，走 ZeroTier）互相送存档 / 同步改过的文件：
            两边各双击一次 一键同步.command（macOS）或 一键同步.cmd（Windows），
            按菜单提示走一遍：显示口令 → 让两边 token 一样 → 启动后台同步服务 → 扫描对端，
            以后每次只要选 2~5 项就能一键互传。游戏里「系统 → 跨设备同步」也能按。
            细节看 README 的「双机同步」一节；配置在 tools/sync/sync.config.json（每台机器一份）。

          想要完全没有浏览器的独立程序窗口：仓库的 .github/workflows/tauri.yml 会构建
            Windows（.exe 安装包）与 macOS（.dmg）原生安装包，源码在 src-tauri/。
          TXT
            sed -i 's/^          //' "$out/启动说明.txt"
            (cd dist && zip -qr "$name-$TAG.zip" "$name")
            ls -la "dist/$name-$TAG.zip"
          }

          build mac
          build win

      - name: 创建 Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="manual-$(date +%Y%m%d-%H%M)"; fi
          NOTES="解压即玩：macOS 双击 启动游戏.command，Windows 双击 启动游戏.cmd，详细说明见包内「启动说明.txt」。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes --notes "$NOTES"
          fi

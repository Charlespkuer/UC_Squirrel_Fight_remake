<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="../../">
<meta charset="UTF-8">
<title>体力槽检查</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/classic.css">
<link rel="stylesheet" href="css/classic-extras.css">
<link rel="stylesheet" href="css/classic-fusion.css">
<link rel="stylesheet" href="css/debug.css">
<link rel="stylesheet" href="css/battle-drops.css">
<link rel="stylesheet" href="css/classic-refine.css">
<script>
window.__errs = [];
window.addEventListener('error', function (e) { window.__errs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0)); });
</script>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <div id="boot-note">初始化…</div>
</div>
<script src="js/orig/Map.min.js"></script>
<script src="js/orig/GameDict.js"></script>
<script src="js/orig/animationStr.js"></script>
<script src="js/orig/assets.js"></script>
<script src="js/orig/asset2.js"></script>
<script src="js/engine.js"></script>
<script src="js/gamedata.js"></script>
<script src="js/state.js"></script>
<script src="js/sim.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/classic-ui.js"></script>
<script src="js/classic-extras.js"></script>
<script src="js/classic-fusion.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
<script>
/* 开发检查：?ratio= 指定体力比例（0~1）渲染首页，用于核对体力槽配色与可读性。
 * 结果在 window.__energy。 */
(function () {
  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? Number(q.get(k)) : d);
  window.addEventListener('load', async () => {
    localStorage.removeItem('ssdz_debug');
    await new Promise((r) => setTimeout(r, 250));
    State.newGame('体力测试');
    const S = State.state();
    S.level = 34; S.maxEnergy = 180;
    S.energy = Math.round(180 * num('ratio', 0.62));
    S.goldPoint = 19980; S.exp = 373;
    GData.nextExp = () => 1000;
    Main.showHome();
    if (q.has('fps')) Main.setHomeFps(num('fps', 22));
    await new Promise((r) => setTimeout(r, 900));
    const meter = document.querySelector('.home-energy');
    const fill = document.querySelector('.home-energy>i');
    const numEl = document.querySelector('.home-energy .num');
    const r = (el) => { const b = el.getBoundingClientRect(); return { x: +b.left.toFixed(1), y: +b.top.toFixed(1), w: +b.width.toFixed(1), h: +b.height.toFixed(1), right: +b.right.toFixed(1) }; };
    const cs = getComputedStyle(meter);
    const csFill = getComputedStyle(fill);
    window.__energy = {
      energy: S.energy, max: S.maxEnergy,
      meter: r(meter), fill: r(fill), num: r(numEl),
      fillPercent: +(100 * S.energy / S.maxEnergy).toFixed(1),
      emptyBackground: cs.backgroundImage.slice(0, 90),
      emptyColor: cs.color,
      fillBackground: csFill.backgroundImage.slice(0, 90),
      numText: numEl.dataset.text,
      overflowRight: r(numEl).right > r(meter).right,
      errs: window.__errs,
    };
    document.title = 'READY';
  });
})();
</script>
</body>
</html>

name: Deploy to GitHub Pages

# 这是最省事的「Mac + Windows 都能玩」的发布方式：
# 不需要打包、不需要安装任何东西，浏览器打开同一个网址即可。
# 仓库 Settings → Pages → Source 选 "GitHub Actions" 后，推 main 就会自动部署。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_configured: ${{ steps.configure_pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 只发布游戏运行需要的东西：index.html + css/js/images/audio + PWA 资源。
      # references/（含原 APK）与 tools/（开发工具、截图证据）不进站点，省流量也避免版权问题。
      # serve.js / serve.py / 启动器是给「下载到本地玩」用的，静态站点上不需要（Pages 上存档退到 localStorage）。
      - name: 组装站点目录（Web/PWA）
        run: |
          # 统一由 tools/build-web.cjs 生成：
          #   · 复制 scripts/index.html 到站点根，并注入 manifest / apple-touch-icon / web mode；
          #   · 复制 css/js/images/audio（自动跳过 images/_reference）；
          #   · 复制 manifest.webmanifest / sw.js / icons，并把核心文件清单注入 sw.js；
          #   · 复制 scripts/version.json。
          node tools/build-web.cjs --out _site
          du -sh _site
          find _site -maxdepth 1 -mindepth 1 | sort

      - id: configure_pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.configure_pages.outcome == 'success'
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages_configured == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

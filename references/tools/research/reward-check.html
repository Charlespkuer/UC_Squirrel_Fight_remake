<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="../../../">
<meta charset="UTF-8">
<title>升级奖励与经验栏检查</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/classic.css">
<link rel="stylesheet" href="css/classic-extras.css">
<link rel="stylesheet" href="css/classic-fusion.css">
<link rel="stylesheet" href="css/debug.css">
<link rel="stylesheet" href="css/battle-drops.css">
<link rel="stylesheet" href="css/classic-refine.css">
<script>
window.__errs = [];
window.addEventListener('error', function (e) { window.__errs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0)); });
window.addEventListener('unhandledrejection', function (e) { window.__errs.push('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
</script>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <div id="boot-note">初始化…</div>
</div>
<script src="js/orig/Map.min.js"></script>
<script src="js/orig/GameDict.js"></script>
<script src="js/orig/animationStr.js"></script>
<script src="js/orig/assets.js"></script>
<script src="js/orig/asset2.js"></script>
<script src="js/engine.js"></script>
<script src="js/gamedata.js"></script>
<script src="js/state.js"></script>
<script src="js/sim.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/classic-ui.js"></script>
<script src="js/classic-extras.js"></script>
<script src="js/classic-fusion.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
<script>
/* 开发检查：
 * - 首页经验栏应只显示 x/y（没有 %）
 * - 升级奖励面板（参考 references/new/13401b861367adab44aede056.webp）
 * 会真实结算一次战斗奖励并弹出结果面板，便于截图核对。
 * 结果在 window.__report.check。 */
(function () {
  window.addEventListener('load', async () => {
    document.title = 'LOADING';
    localStorage.removeItem('ssdz_debug');
    await new Promise((r) => setTimeout(r, 250));
    State.newGame('奖励检查');
    const S = State.state();
    S.level = 20;
    S.power = 30; S.agility = 30; S.speed = 30; S.maxHp = 300;
    S.weapons = ['1:5']; S.skills = [];
    S.exp = GData.nextExp(20) - 1;      // 再拿 1 点经验即升级
    S.goldPoint = 19980; S.energy = 100; S.maxEnergy = 180;
    Main.showHome();
    await new Promise((r) => setTimeout(r, 600));

    const check = {};
    const meterNum = document.querySelector('.home-exp-val .num');
    check.expText = meterNum ? meterNum.dataset.text : null;
    check.expHasPercent = meterNum ? meterNum.dataset.text.includes('%') : null;
    check.expCountCapsuleRemoved = !document.querySelector('.home-exp-count');
    check.expTextIsRatio = /^\d+\/\d+$/.test(check.expText || '');

    // 触发一次真实升级结算（直接结算战斗奖励，避开战斗演出）
    const reward = State.fightReward(true);
    check.upsCount = (reward.ups || []).length;
    check.upsShape = (reward.ups || []).map((u) => ({
      level: u.level, power: u.power, agility: u.agility, speed: u.speed, hp: u.hp,
      reward: u.reward, rewardId: u.rewardId, rewardKind: u.rewardKind,
    }));

    // 渲染奖励面板（走真实 resultModal）
    UI.classic.resultModal(true, reward);
    await new Promise((r) => setTimeout(r, 350));
    const panel = document.querySelector('.result-box .reward-panel');
    check.panelRendered = !!panel;
    if (panel) {
      const titleImg = panel.querySelector('.reward-title img');
      check.panelTitleImg = titleImg ? titleImg.getAttribute('src') : null;
      check.cards = [...panel.querySelectorAll('.reward-card')].map((c) => ({
        cls: [...c.classList].filter((x) => x !== 'reward-card').join(',') || null,
        text: (c.querySelector('.reward-text') || {}).textContent || null,
        img: c.querySelector('img') ? c.querySelector('img').getAttribute('src') : null,
        badge: c.querySelector('.reward-badge') ? c.querySelector('.reward-badge').textContent : null,
      }));
      check.panelBox = (() => { const b = panel.getBoundingClientRect(); return { w: +b.width.toFixed(0), h: +b.height.toFixed(0) }; })();
      check.cardsInsidePanel = [...panel.querySelectorAll('.reward-card')].every((c) => {
        const cb = c.getBoundingClientRect(), pb = panel.getBoundingClientRect();
        return cb.left >= pb.left - 1 && cb.right <= pb.right + 1;
      });
    }
    // 武器类奖励也要能取到原版图标
    check.weaponRewardPanel = UI.classic.upgradeReward([
      { level: 22, power: 0, agility: 0, speed: 0, hp: 0, reward: '木剑', rewardId: 3, rewardKind: 'weapon' },
    ]).includes('weapon-3');

    window.__report = { check, errs: window.__errs };
    document.title = 'READY';
  });
})();
</script>
</body>
</html>

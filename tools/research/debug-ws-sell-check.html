<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="/">
<meta charset="UTF-8">
<title>调试武技 / 卖果实 / 任务随机 / 体力条检查</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/classic.css">
<link rel="stylesheet" href="css/classic-extras.css">
<link rel="stylesheet" href="css/classic-fusion.css">
<link rel="stylesheet" href="css/debug.css">
<link rel="stylesheet" href="css/battle-drops.css">
<link rel="stylesheet" href="css/classic-refine.css">
<script>
window.__errs = [];
window.addEventListener('error', function (e) { window.__errs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0)); });
window.addEventListener('unhandledrejection', function (e) { window.__errs.push('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
</script>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <div id="boot-note">初始化…</div>
</div>
<script src="js/orig/Map.min.js"></script>
<script src="js/orig/GameDict.js"></script>
<script src="js/orig/animationStr.js"></script>
<script src="js/orig/assets.js"></script>
<script src="js/orig/asset2.js"></script>
<script src="js/engine.js"></script>
<script src="js/gamedata.js"></script>
<script src="js/state.js"></script>
<script src="js/sim.js"></script>
<script src="js/battle-drops.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/classic-ui.js"></script>
<script src="js/classic-extras.js"></script>
<script src="js/classic-fusion.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
<script>
/* 1) 调试面板：快速获得/遗忘武器技能、一键升级不越 60 级、一键满级发礼包与武技
 * 2) 背包数量不再带 X 前缀
 * 3) 天使果实可以 100 金松果卖出
 * 4) 每日任务纯随机 1~2 项奖励
 * 5) 合成滑动条加大、主界面体力条多一圈细棕框
 * 结果在 window.__report.check。 */
(function () {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  window.addEventListener('load', async () => {
    document.title = 'LOADING';
    localStorage.removeItem('ssdz_debug');
    await wait(250);
    State.newGame('调试检查');
    const S = State.state();
    S.level = 40; S.goldPoint = 500; S.props[47] = 6;
    State.save();
    Main.showHome();
    await wait(400);
    const check = {};
    const panel = () => document.querySelector('.debug-panel');

    // ---------- 调试面板：武技获得 / 遗忘 ----------
    Debug.open();
    await wait(200);
    const p = panel();
    check.panel = {
      weaponSelects: p.querySelectorAll('[data-ws-select="weapon"] option').length,
      skillSelects: p.querySelectorAll('[data-ws-select="skill"] option').length,
      ownedChips: p.querySelectorAll('[data-ws-owned] .debug-ws-chip').length,
    };
    const wSel = p.querySelector('[data-ws-select="weapon"]');
    const kSel = p.querySelector('[data-ws-select="skill"]');
    const wId = Number(wSel.value), kId = Number(kSel.value);
    p.querySelector('[data-ws-level="weapon"]').value = '9';
    p.querySelector('[data-ws-learn="weapon"]').click();
    await wait(120);
    check.grantWeapon = { weapons: S.weapons.slice(), msg: p.querySelector('.debug-msg').textContent, chips: p.querySelectorAll('[data-ws-owned] .debug-ws-chip').length };
    p.querySelector('[data-ws-level="skill"]').value = '3';
    p.querySelector('[data-ws-learn="skill"]').click();
    await wait(120);
    check.grantSkill = { skills: S.skills.slice(), msg: p.querySelector('.debug-msg').textContent };
    // 再获得一次同名武器 = 改等级，不重复
    p.querySelector('[data-ws-level="weapon"]').value = '12';
    p.querySelector('[data-ws-learn="weapon"]').click();
    await wait(120);
    check.replaceWeapon = { weapons: S.weapons.slice(), msg: p.querySelector('.debug-msg').textContent };
    // 遗忘
    const chip = p.querySelector('[data-ws-forget="weapon:' + wId + '"]');
    check.hasForgetButton = !!chip;
    if (chip) chip.click();
    await wait(120);
    check.forgetWeapon = { weapons: S.weapons.slice(), msg: p.querySelector('.debug-msg').textContent };
    check.api = { grant: Debug.grantWS('skill', kId, 15), forget: Debug.forgetWS('skill', kId) };
    check.apis = Debug.grantWS('weapon', wId, 5);

    // ---------- 金松果 / 金杯 / 经验走货币字段，不进背包 ----------
    {
      const goldBefore = S.goldPoint, cupBefore = S.goldCup, expBefore = S.exp, lvBefore = S.level;
      const msgGold = Debug.grantItem(8, 500);
      const msgCup = Debug.grantItem(40, 7);
      const msgExp = Debug.grantItem(15, 200);
      check.currency = {
        goldDelta: S.goldPoint - goldBefore, cupDelta: S.goldCup - cupBefore,
        expOrLevel: S.level > lvBefore ? 'level+' + (S.level - lvBefore) : 'exp+' + (S.exp - expBefore),
        inBag: [8, 15, 40].filter((id) => (S.props[id] || 0) > 0),
        msgs: [msgGold, msgCup, msgExp],
        optionLabels: [8, 40, 15].map((id) => {
          const o = p.querySelector('[data-item-select] option[value="' + id + '"]');
          return o ? o.textContent.trim() : null;
        }),
      };
      const gold0 = S.goldPoint;
      const allBtn = [...p.querySelectorAll('.debug-actions button')].find((b) => b.textContent.trim() === '全道具 +10');
      if (allBtn) allBtn.click();
      await wait(150);
      check.allProps = { msg: p.querySelector('.debug-msg').textContent, bag8: S.props[8] || 0, goldDelta: S.goldPoint - gold0 };
    }

    // ---------- 重置每日与体力计时：天梯次数、每日任务、抽奖、限兑都要复位 ----------
    {
      S.joinRankCount = 7; S.dailyWins = 3; S.dailyFails = 2;
      S.dailyClaimDate = State.localDate();
      S.lotteryDate = State.localDate(); S.lotteryFree = 0;
      S.rankPurchaseDay = State.localDate(); S.rankPurchases = { 11: 1 };
      S.dailyStatsDate = State.localDate();
      S.quests = null; S.dailyCounters = null;
      const quests0 = State.questStatus();
      State.bumpDaily(quests0[0].key, quests0[0].need);
      State.claimQuest(0);
      S.energy = 5; S.lastEnergyTs = Date.now() - 3600000;
      State.save();
      const before = { claimed: State.questStatus()[0].claimed, progress: State.questStatus()[0].progress, gifts: State.dailyStatus().claimed };
      const resetBtn = [...p.querySelectorAll('.debug-actions button')].find((b) => b.textContent.trim() === '重置每日与体力计时');
      if (resetBtn) resetBtn.click();
      await wait(200);
      const after = State.questStatus();
      check.resetDaily = {
        before,
        msg: p.querySelector('.debug-msg').textContent,
        joinRankCount: S.joinRankCount,
        dailyWins: S.dailyWins, dailyFails: S.dailyFails,
        giftClaimable: !State.dailyStatus().claimed,
        lotteryFree: S.lotteryFree,
        questsReset: !!after.length && after.every((q) => !q.claimed && q.progress === 0),
        questCount: after.length,
        rankPurchases: Object.keys(S.rankPurchases || {}).length,
        refreshCount: (S.challengeRefresh || {}).count,
        energyFull: S.energy === S.maxEnergy,
      };
    }

    // ---------- 一键升级 / 一键满级 ----------
    const propsBefore = JSON.stringify(S.props);
    const act = (label) => [...p.querySelectorAll('.debug-actions button')].find((b) => b.textContent.trim() === label);
    S.level = 59; S.exp = 0; State.save();
    act('一键升级（升1级）').click();
    await wait(150);
    check.level59 = { level: S.level, msg: p.querySelector('.debug-msg').textContent };
    act('一键升级（升1级）').click();
    await wait(150);
    check.level60 = { level: S.level, msg: p.querySelector('.debug-msg').textContent };
    act('一键升级（升1级）').click();
    await wait(150);
    check.level60again = { level: S.level, msg: p.querySelector('.debug-msg').textContent };

    // 一键满级：从 40 级走到 60 级，应该发礼包与随机武技
    S.level = 40; S.exp = 0; S.weapons = []; S.skills = []; S.props = { 1: 3, 2: 2, 28: 1 }; State.save();
    const goldBefore = S.goldPoint;
    act('一键满级').click();
    await wait(300);
    const gainedProps = Object.keys(S.props).filter((id) => (S.props[id] || 0) > 0);
    check.maxLevel = {
      level: S.level,
      msg: p.querySelector('.debug-msg').textContent,
      weapons: S.weapons.slice(), skills: S.skills.slice(),
      propKinds: gainedProps.length,
      goldDelta: S.goldPoint - goldBefore,
      maxEnergy: S.maxEnergy,
    };
    Debug.close();

    // ---------- 背包数量不带 X ----------
    UI.runAction('bag');
    await wait(200);
    const captions = [...document.querySelectorAll('.bag-grid .item-caption')].map((c) => c.textContent.trim());
    check.captions = captions;
    check.hasX = captions.some((t) => /^[Xx]/.test(t));

    // ---------- 卖出天使果实 ----------
    const s2 = State.state();
    s2.props[47] = 6; s2.goldPoint = 500; State.save();
    UI.runAction('bag');
    await wait(150);
    for (let i = 0; i < 6; i++) {
      const cell = document.querySelector('[data-prop="47"]');
      if (cell) { cell.click(); break; }
      const nx = document.querySelector('[data-action="next"]');
      if (!nx) break;
      nx.click();
    }
    const actBtn = document.querySelector('[data-action="prop-action"]');
    if (actBtn) actBtn.click();
    await wait(150);
    const detail = [...document.querySelectorAll('.classic-modal-overlay')].pop();
    check.sellButton = detail ? [...detail.querySelectorAll('.modal-buttons button')].map((b) => b.textContent.trim()) : null;
    const sellBtn = detail ? [...detail.querySelectorAll('.modal-buttons button')].find((b) => b.textContent.trim() === '卖出') : null;
    if (sellBtn) {
      sellBtn.click();
      await wait(150);
      const sellModal = [...document.querySelectorAll('.classic-modal-overlay')].pop();
      const range = sellModal.querySelector('[data-slider="sell-count"] input');
      check.sellModal = {
        title: sellModal.querySelector('.modal-title').textContent.trim(),
        buttons: [...sellModal.querySelectorAll('.modal-buttons button')].map((b) => b.textContent.trim()),
        max: range.max,
      };
      range.value = '2'; range.dispatchEvent(new Event('input', { bubbles: true }));
      await wait(80);
      check.sellPreview = (sellModal.querySelector('.use-preview') || {}).textContent;
      sellModal.querySelector('.modal-buttons button').click();
      await wait(250);
      check.sellAfter = {
        left: State.state().props[47], gold: State.state().goldPoint,
        stillOnBag: !!document.querySelector('.classic-page[data-screen="bag"]'),
        modalOpen: !!document.querySelector('.classic-modal-overlay'),
        toast: (document.querySelector('.toast') || {}).textContent || '',
      };
      document.querySelectorAll('.classic-modal-overlay').forEach((e) => e.remove());
    }

    // ---------- 每日任务：纯随机 1~2 项 ----------
    const RealNow = Date.now;
    const shapes = [];
    for (let day = 0; day < 8; day++) {
      Date.now = () => new Date(2026, 8, 1 + day, 10).getTime();
      State.state().quests = null; State.state().dailyCounters = null;
      shapes.push(State.questStatus().map((q) => q.rewards.map((r) => r.kind + (r.kind === 'prop' ? ':' + r.id : '') + '×' + r.count)));
    }
    Date.now = RealNow;
    State.state().quests = null; State.state().dailyCounters = null;
    State.save();
    check.quests = {
      counts: shapes.map((d) => d.map((q) => q.length)),
      kinds: [...new Set(shapes.flat(2).map((t) => t.split(':')[0].split('×')[0]))],
      hasQuestWithoutGold: shapes.some((d) => d.some((q) => !q.some((t) => t.startsWith('gold')))),
      hasQuestWithoutExp: shapes.some((d) => d.some((q) => !q.some((t) => t.startsWith('exp')))),
      sample: shapes[0],
    };

    // ---------- 样式：滑动条尺寸与体力条外框 ----------
    Main.showHome();
    await wait(300);
    const meter = document.querySelector('.uc-meter.home-energy');
    check.meterShadow = meter ? getComputedStyle(meter).boxShadow : null;
    const rule = [...document.styleSheets].flatMap((s) => { try { return [...s.cssRules]; } catch (e) { return []; } })
      .filter((r) => r.selectorText && r.selectorText.indexOf('use-slider input') >= 0)
      .map((r) => r.style.height || r.style.cssText.slice(0, 60));
    check.sliderRule = rule;

    check.errs = window.__errs;
    window.__report = { check, errs: window.__errs };
    document.title = 'READY';
  });
})();
</script>
</body>
</html>

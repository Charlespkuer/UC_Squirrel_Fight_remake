<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>松鼠大战 · 怀旧复刻版</title>
<style>
  html,body{margin:0;height:100%;background:#1a120b;color:#ffe9b8;
    font:16px/1.7 "Microsoft YaHei","PingFang SC",sans-serif;display:flex;align-items:center;justify-content:center}
  .box{max-width:640px;padding:36px 40px;border:4px solid #94713a;border-radius:24px;
    background:linear-gradient(#fffdf0,#f4e7c6);color:#6b4b2a}
  h1{margin:0 0 12px;font-size:24px;color:#5c3d1b}
  code{background:#fff6dd;border-radius:6px;padding:1px 6px;font-size:14px}
  ul{margin:10px 0 0;padding-left:22px}
</style>
</head>
<body>
  <div class="box">
    <h1>没找到游戏目录</h1>
    <p>这个桌面版只带了一个空壳，运行时需要旁边的游戏文件（<code>index.html</code>、<code>images/</code>、<code>audio/</code> 等）。</p>
    <ul>
      <li>把 <code>ssdz-classic.exe</code> 放回游戏文件夹里再双击；</li>
      <li>或者双击游戏目录里的 <code>启动游戏.cmd</code>；</li>
      <li>用安装包装的那种独立版不受影响（前端已经打进去了）。</li>
    </ul>
  </div>
</body>
</html>

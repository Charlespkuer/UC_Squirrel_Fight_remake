<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>松鼠大战 · 怀旧单机复刻版</title>
<style>
/* iOS WKWebView 禁止双击缩放/长按菜单；安卓整页 touch-action:manipulation 才能把
   click 延迟从 ~190ms 降到 ~4ms。⚠ iOS 的 body 级 touch-action 会吞点击合成，只给控件加。 */
@supports (-webkit-touch-callout: none) {
  html, body { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  body { -webkit-touch-callout: none; }
  button, input { touch-action: manipulation; }
}
@supports not (-webkit-touch-callout: none) {
  #app, #app * { touch-action: manipulation; }
}
</style>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/classic.css">
<link rel="stylesheet" href="css/classic-extras.css">
<link rel="stylesheet" href="css/classic-fusion.css">
<link rel="stylesheet" href="css/debug.css">
<link rel="stylesheet" href="css/battle-drops.css">
<link rel="stylesheet" href="css/classic-refine.css">
<!-- 无尽塔样式与脚本按需加载（首次进关卡页双塔入口 / 村庄「征战」时），见 js/tower-loader.js -->
<script>
// 运行时错误收集（供自检模式 ?test=1 报告问题，不影响正常游戏）
window.__errs = [];
window.addEventListener('error', function (e) {
  window.__errs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0));
});
window.addEventListener('unhandledrejection', function (e) {
  window.__errs.push('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
});
</script>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <div id="boot-note">初始化…</div>
</div>
<!-- 昵称长度规则：标题页 / 修改昵称 / 存档兜底共用同一份 7 个汉字口径 -->
<script src="js/nickname.js"></script>
<!-- 游戏数据唯一来源；运行时不引用 references/。 -->
<script src="js/gamedict.js"></script>
<script src="js/engine.js"></script>
<script src="js/gamedata.js"></script>
<!-- 无尽塔 5 个脚本与 tower.css 不随首屏加载：由 tower-loader 在第一次点入口时注入。 -->
<script src="js/tower-loader.js"></script>
<script src="js/state.js"></script>
<!-- 桌面壳把存档通道换成 Rust 端文件读写；网页版为空操作。 -->
<script src="js/tauri-bridge.js"></script>
<script src="js/sim.js"></script>
<script src="js/battle.js"></script>
<script src="js/battle-drops.js"></script>
<!-- 经典界面 = 原版 ssfight 导出数据渲染；素材由 tools/gen-ssfight-ui.cjs 生成到 images/ssfight/ui/。 -->
<script src="js/ssfight/render.js"></script>
<!-- 村庄主界面（main 帧）= 原版 MainMovie.as showMain() 的等价 JS -->
<script src="js/ssfight/ui-main.js"></script>
<script src="js/ssfight/ui-feedback.js"></script>
<!-- 升级页（main 包 7795）：1~29 帧大图，第 30 帧「升级奖励」四格。 -->
<script src="js/ssfight/ui-levelup.js"></script>
<!-- 新手引导（原版 3625）：前 7 帧，后续帧按需接。 -->
<script src="js/ssfight/ui-guide.js"></script>
<!-- 村庄四个地点场景页：运行时 attachMovie 的库元件，依赖 ui-main.js 的 toolkit。 -->
<script src="js/ssfight/ui-village.js"></script>
<!-- 状态页（zhuangtai / 7218）；素材单独成包（tags-status.json）。 -->
<script src="js/ssfight/ui-status.js"></script>
<!-- 经典道具合成：4886 f5 合成页 + 4402「合成中」过场/结果页。 -->
<script src="js/ssfight/ui-compose.js"></script>
<!-- 经典背包「道具使用」：4886 f1「道具1」弹窗（使用 / 取消位置对调）。 -->
<script src="js/ssfight/ui-prop-use.js"></script>
<!-- 挑战页（tiaozhan / 7638）；素材单独成包（tags-challenge.json）。 -->
<script src="js/ssfight/ui-challenge.js"></script>
<!-- 消息页（message / 7819）；素材单独成包（tags-message.json）。 -->
<script src="js/ssfight/ui-message.js"></script>
<!-- 原版战果、竞技续战与天梯/关卡继续挑战容器。 -->
<script src="js/ssfight/ui-fight-result.js"></script>
<!-- 局内战斗 / 胜利失败 / 战果 / 开宝箱抽奖 = 原版 fight 帧（7772 + 7689 两个格斗者 + 松鼠 6532）。
     素材拆成 core（tags-fight-core.json）+ 按动作加载的 tags-fight-<动作元件>.json，只有真的开打才拉。 -->
<script src="js/ssfight/ui-fight.js"></script>
<script src="js/ui.js"></script>
<script src="js/classic-ui.js"></script>
<script src="js/classic-extras.js"></script>
<script src="js/classic-fusion.js"></script>
<!-- 无尽塔剧情（文本 + 播片机 + 「什么时候该播」）由 tower-loader 在进塔前加载。 -->
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
<!-- iOS 15 WKWebView 轻点不合成 click 时的兜底；正常设备不会重复触发。 -->
<script src="js/touch-fallback.js"></script>
</body>
</html>

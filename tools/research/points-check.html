<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="/">
<meta charset="UTF-8">
<title>自由属性点检查</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/classic.css">
<link rel="stylesheet" href="css/classic-extras.css">
<link rel="stylesheet" href="css/classic-fusion.css">
<link rel="stylesheet" href="css/debug.css">
<link rel="stylesheet" href="css/battle-drops.css">
<link rel="stylesheet" href="css/classic-refine.css">
<script>
window.__errs = [];
window.addEventListener('error', function (e) { window.__errs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0)); });
window.addEventListener('unhandledrejection', function (e) { window.__errs.push('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
</script>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <div id="boot-note">初始化…</div>
</div>
<script src="js/orig/Map.min.js"></script>
<script src="js/orig/GameDict.js"></script>
<script src="js/orig/animationStr.js"></script>
<script src="js/orig/assets.js"></script>
<script src="js/orig/asset2.js"></script>
<script src="js/engine.js"></script>
<script src="js/gamedata.js"></script>
<script src="js/state.js"></script>
<script src="js/sim.js"></script>
<script src="js/battle-drops.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/classic-ui.js"></script>
<script src="js/classic-extras.js"></script>
<script src="js/classic-fusion.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
<script>
window.addEventListener('load', function () {
  localStorage.removeItem('ssdz_debug');
  State.newGame('加点检查');
  var S = State.state();
  S.level = 14; S.energy = S.maxEnergy; S.goldPoint = 1234;
  S.power = 22; S.agility = 20; S.speed = 21; S.maxHp = 220;
  State.save();
  Main.showHome();
  window.__report = { ready: true, errs: window.__errs };

  /* 升 n 级（走真实升级流程），再回首页触发必选弹窗 */
  window.__levelUp = function (n) {
    for (var i = 0; i < (n || 1); i++) State.gainExp(GData.nextExp(State.state().level));
    Main.showHome();
    return { pending: State.pendingPoints(), free: State.state().freePoints };
  };
  /* 把某一项压到门槛以下，检查系统代选的提示与高亮（四项都试） */
  window.__force = function (which) {
    var s = State.state();
    s.power = 30; s.agility = 30; s.speed = 30; s.maxHp = 300;
    var key = which || 'speed';
    if (key === 'hp') s.maxHp = 40; else s[key] = 8;
    s.freePoints = 2;
    State.save();
    document.querySelectorAll('.classic-modal-overlay').forEach(function (e) { e.remove(); });
    UI.classic.freePointDialog();
    return State.statShares();
  };
  /* 弹窗状态：剩余点数、代选提示、按钮可用性 */
  window.__state = function () {
    var m = document.querySelector('.point-dialog');
    if (!m) return 'no-dialog';
    var s = State.state();
    var rows = [].map.call(m.querySelectorAll('.free-point-row'), function (row) {
      var key = row.dataset.row;
      return { stat: key, value: row.querySelector('.fp-value').textContent, live: String(s[key === 'hp' ? 'maxHp' : key]), share: row.querySelector('.fp-share').textContent, forced: row.classList.contains('forced'), button: row.querySelector('button').textContent };
    });
    return {
      title: m.querySelector('.modal-title').textContent,
      hasClose: !!m.querySelector('.modal-close'),
      note: m.querySelector('[data-live="point-note"]').textContent,
      left: m.querySelector('[data-live="point-left"]').textContent,
      buttons: [].map.call(m.querySelectorAll('.modal-buttons button'), function (b) { return b.textContent.trim() + (b.disabled ? '(禁用)' : ''); }),
      rows: rows, pending: State.pendingPoints(),
    };
  };
  /* 点某一项 +1（走真实分配），返回结果与分配后的状态 */
  window.__alloc = function (which) {
    var b = document.querySelector('[data-point="' + which + '"]');
    if (!b) return 'no-button';
    b.click();
    return window.__state();
  };
  /* 平均分配 */
  window.__even = function () {
    var b = [].find.call(document.querySelectorAll('.point-dialog .modal-buttons button'), function (x) { return x.textContent.trim() === '平均分配'; });
    if (!b) return 'no-button';
    b.click();
    return window.__state();
  };
  /* 确定（点完才可用） */
  window.__confirm = function () {
    var b = [].find.call(document.querySelectorAll('.point-dialog .modal-buttons button'), function (x) { return x.textContent.trim() === '确定'; });
    if (!b) return 'no-button';
    if (b.disabled) return 'disabled';
    b.click();
    return { closed: !document.querySelector('.point-dialog'), pending: State.pendingPoints() };
  };
  /* 状态页：不应该再有「自由属性点」面板（点数只在升级弹窗里出现） */
  window.__status = function () {
    document.querySelectorAll('.classic-modal-overlay').forEach(function (e) { e.remove(); });
    State.state().freePoints = 0;
    State.save();
    UI.runAction('status');
    var page = document.querySelector('#ui .classic-page');
    return { hasPointPanel: !!document.querySelector('.status-points'), hasPointsText: !!page && page.textContent.indexOf('自由属性点') >= 0 };
  };
  /* 战斗结算里的升级奖励卡片（自选点 / 系统代选） */
  window.__reward = function (keepPending) {
    document.querySelectorAll('.classic-modal-overlay').forEach(function (e) { e.remove(); });
    State.state().freePoints = 0;
    var ups = State.gainExp(GData.nextExp(State.state().level));
    if (!keepPending) { State.state().freePoints = 0; State.save(); }   // 只看奖励面板本身
    UI.classic.resultModal(true, { exp: 40, gold: 12, ups: ups });
    return ups.map(function (u) { return { level: u.level, freePoint: u.freePoint, autoPoint: u.autoPoint }; });
  };
  /* 一键满级（调试面板的批量流程）：结束后先弹「三选一」，选完再轮到加点弹窗 */
  window.__bulk = function () {
    document.querySelectorAll('.classic-modal-overlay').forEach(function (e) { e.remove(); });
    var S2 = State.state(); S2.level = 40; S2.freePoints = 0; S2.wsPicks = []; State.save();
    while (S2.level < 70) State.gainExp(GData.nextExp(S2.level));
    UI.classic.promptLevelUpChoices();
    return { pending: State.pendingPoints(), pendingWS: State.pendingWS() };
  };
  /* 点「手气不错（全部随机）」：把攒下的三选一组一次选完，接着应弹加点弹窗 */
  window.__wsRandomAll = function () {
    var b = [].filter.call(document.querySelectorAll('.ws-choice-dialog .modal-buttons button'), function (x) { return /手气不错|随便/.test(x.textContent); })[0];
    if (!b) return 'no-button';
    b.click();
    return {
      pendingWS: State.pendingWS(),
      ownedWS: State.state().weapons.length + State.state().skills.length,
      wsDialog: !!document.querySelector('.ws-choice-dialog'),
      pointDialog: !!document.querySelector('.point-dialog'),
      toast: (document.querySelector('.toast') || {}).textContent || '',
    };
  };

  var flag = document.createElement('span');
  flag.id = 'viz-ready';
  flag.style.display = 'none';
  document.body.appendChild(flag);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="/">
<meta charset="UTF-8">
<title>BGM 自动播放检查</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/classic.css">
<link rel="stylesheet" href="css/classic-extras.css">
<link rel="stylesheet" href="css/classic-fusion.css">
<link rel="stylesheet" href="css/debug.css">
<link rel="stylesheet" href="css/battle-drops.css">
<link rel="stylesheet" href="css/classic-refine.css">
<script>
/* 在 main.js 之前把 Audio 包一层，记录 BGM 元素的创建与 play() 调用次数。
 * 用来验证「一打开页面就尝试播 BGM」，以及被自动播放策略拦下时会在第一次交互补播。 */
window.__errs = [];
window.addEventListener('error', function (e) { window.__errs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0)); });
(function () {
  window.__audios = [];
  const RealAudio = window.Audio;
  function TrackedAudio(src) {
    const el = new RealAudio(src);
    const rec = { src: String(src), el: el, played: 0, rejected: 0 };
    window.__audios.push(rec);
    const realPlay = el.play.bind(el);
    el.play = function () {
      rec.played++;
      const p = realPlay();
      if (p && typeof p.catch === 'function') p.catch(function () { rec.rejected++; });
      return p;
    };
    return el;
  }
  TrackedAudio.prototype = RealAudio.prototype;
  window.Audio = TrackedAudio;
})();
</script>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <div id="boot-note">初始化…</div>
</div>
<script src="js/orig/Map.min.js"></script>
<script src="js/orig/GameDict.js"></script>
<script src="js/orig/animationStr.js"></script>
<script src="js/orig/assets.js"></script>
<script src="js/orig/asset2.js"></script>
<script src="js/engine.js"></script>
<script src="js/gamedata.js"></script>
<script src="js/state.js"></script>
<script src="js/sim.js"></script>
<script src="js/battle-drops.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/classic-ui.js"></script>
<script src="js/classic-extras.js"></script>
<script src="js/classic-fusion.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
<script>
(function () {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const snap = () => window.__audios.map((a) => ({ src: a.src.split('/').pop(), played: a.played, rejected: a.rejected }));
  window.addEventListener('load', async () => {
    document.title = 'LOADING';
    const check = {};
    // boot 是异步的（要加载图集），等它把标题画面/主界面铺出来
    for (let i = 0; i < 120; i++) {
      await wait(150);
      if (document.querySelector('.title-screen') || document.querySelector('.classic-home')) break;
    }
    check.atOpen = snap();
    check.screen = document.querySelector('.title-screen') ? 'title' : document.querySelector('.classic-home') ? 'home' : 'boot';
    // 第一次交互应该补播（前提是被拦过；没被拦则 played 不再增加）
    window.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
    await wait(400);
    check.afterClick = snap();
    window.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
    await wait(300);
    check.afterSecondClick = snap();
    check.errs = window.__errs;
    window.__report = { check, errs: window.__errs };
    document.title = 'READY';
  });
})();
</script>
</body>
</html>

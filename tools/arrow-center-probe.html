<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- 翻页箭头居中探针（开发用，不属于游戏本体）。
     用真实 CSS 渲染三种翻页按钮，无缩放、白底、固定坐标，
     供 headless Chrome 截图后用 PIL 量「字形墨迹中心 vs 圆框圆心」。
     用法：chrome --headless --screenshot=out.png --window-size=1000,700
                  --force-device-scale-factor=2 file:///.../arrow-center-probe.html -->
<meta charset="UTF-8">
<title>箭头居中探针</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/classic.css">
<link rel="stylesheet" href="../css/classic-extras.css">
<link rel="stylesheet" href="../css/classic-fusion.css">
<link rel="stylesheet" href="../css/classic-refine.css">
<style>
  html,body{background:#fff;margin:0}
  .probe-row{position:relative;height:170px;display:flex;align-items:center;gap:60px;padding:0 20px}
  .probe-anchor{position:relative;width:130px;height:130px;flex:0 0 auto}
  /* 让 .page-arrow（absolute）有定位父级，且箭头落在锚点正中 */
  .probe-anchor .page-arrow{position:absolute;left:50%!important;right:auto!important;top:50%!important;transform:translate(-50%,-50%)}
  .probe-label{font:14px monospace;color:#333}
</style>
</head>
<body>
<div class="probe-row" id="row-a">
  <div class="probe-anchor" id="a-prev"><div class="page-arrow prev"><button type="button" class="uc-button arrow" data-action="prev"><span class="reference-button-label">‹</span><i class="chev chev-l" aria-hidden="true"></i></button></div></div>
  <div class="probe-anchor" id="a-next"><div class="page-arrow"><button type="button" class="uc-button arrow" data-action="next"><span class="reference-button-label">›</span><i class="chev chev-r" aria-hidden="true"></i></button></div></div>
  <span class="probe-label">A: .page-arrow .uc-button.arrow (62px, bag/shop)</span>
</div>
<div class="probe-row" id="row-b">
  <div class="probe-anchor" id="b-prev"><button type="button" class="uc-button arrow" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)"><span class="reference-button-label">‹</span><i class="chev chev-l" aria-hidden="true"></i></button></div>
  <span class="probe-label">B: .uc-button.arrow base (52px)</span>
</div>
<div class="probe-row" id="row-c">
  <div class="probe-anchor" id="c-pag"><div class="fusion-pagination" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)"><button type="button" class="uc-button tiny" data-fusion-action="previous"><i class="chev chev-l" aria-hidden="true"></i></button><span>1 / 3</span><button type="button" class="uc-button tiny" data-fusion-action="next"><i class="chev chev-r" aria-hidden="true"></i></button></div></div>
  <span class="probe-label">C: .fusion-pagination .uc-button.tiny (31px, fusion)</span>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="/">
<meta charset="UTF-8">
<title>挑战跳过检查</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/classic.css">
<link rel="stylesheet" href="css/classic-extras.css">
<link rel="stylesheet" href="css/classic-fusion.css">
<link rel="stylesheet" href="css/debug.css">
<link rel="stylesheet" href="css/battle-drops.css">
<link rel="stylesheet" href="css/classic-refine.css">
<script>
window.__errs = [];
window.__logs = [];
window.addEventListener('error', function (e) { window.__errs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0)); });
window.addEventListener('unhandledrejection', function (e) { window.__errs.push('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
(function () {
  const ce = console.error;
  console.error = function () { window.__logs.push([].slice.call(arguments).map(String).join(' ').slice(0, 400)); ce.apply(console, arguments); };
})();
</script>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <div id="boot-note">初始化…</div>
</div>
<script src="js/orig/Map.min.js"></script>
<script src="js/orig/GameDict.js"></script>
<script src="js/orig/animationStr.js"></script>
<script src="js/orig/assets.js"></script>
<script src="js/orig/asset2.js"></script>
<script src="js/engine.js"></script>
<script src="js/gamedata.js"></script>
<script src="js/state.js"></script>
<script src="js/sim.js"></script>
<script src="js/battle-drops.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/classic-ui.js"></script>
<script src="js/classic-extras.js"></script>
<script src="js/classic-fusion.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
<script>
/* 复现：随机挑战里点「跳过」，看是否异常回到主界面。
 * ?mode=random 随机挑战 / ?mode=stage 关卡挑战
 * 结果在 window.__report.check。 */
(function () {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const mode = (location.search.match(/[?&]mode=(\w+)/) || [, 'random'])[1];
  const delay = Number((location.search.match(/[?&]delay=(\d+)/) || [, '2200'])[1]);
  window.addEventListener('load', async () => {
    document.title = 'LOADING';
    localStorage.removeItem('ssdz_debug');
    await wait(250);
    State.newGame('跳过检查');
    const S = State.state();
    S.level = 20; S.power = 40; S.agility = 40; S.speed = 40; S.maxHp = 4000;
    S.energy = S.maxEnergy; S.props[23] = 20; S.props = Object.assign({ 23: 20 }, S.props);
    S.weapons = ['1:5', '2:5']; S.skills = [];
    State.save();
    Main.showHome();
    await wait(400);

    const check = { mode, delay };
    const snap = (tag) => {
      const overlays = document.querySelectorAll('.classic-modal-overlay');
      const last = overlays[overlays.length - 1];
      return {
        tag,
        screen: UI.currentScreen(),
        mode: (window.Main && Main.__mode) || null,
        hasSkip: !!document.querySelector('[aria-label="跳过战斗"]'),
        modal: last ? last.querySelector('.modal-title') ? last.querySelector('.modal-title').textContent.trim() : last.textContent.replace(/\s+/g, ' ').slice(0, 80).trim() : null,
        overlayCount: overlays.length,
        toast: (document.querySelector('.toast') || {}).textContent || null,
        onHome: !!document.querySelector('.classic-home'),
      };
    };

    // 进入挑战页 → 选对手 → 开打
    UI.runAction('challenge');
    await wait(300);
    check.step1 = snap('challenge-page');
    const found = {};
    if (mode === 'random') {
      const foe = document.querySelector('[data-foe="0"]');
      found.foe = !!foe;
      if (foe) {
        foe.click();
        await wait(250);
        const fight = document.querySelector('[data-action="fight"]');
        found.fight = !!fight;
        if (fight) fight.click();
      }
    } else {
      const tab = document.querySelector('[data-action="stages"]');
      found.tab = !!tab;
      if (tab) tab.click();
      await wait(300);
      const t0 = document.querySelector('[data-action="type0"]');
      found.type0 = !!t0;
      if (t0) t0.click();
      await wait(250);
      const s1 = document.querySelector('[data-action="star1"]');
      found.star1 = !!s1;
      if (s1) s1.click();
      await wait(300);
      const go = document.querySelector('.classic-modal-overlay [data-action="0"]');
      found.confirm = !!go;
      check.confirmText = go ? go.textContent.trim() : null;
      if (go) go.click();
    }
    check.found = found;
    check.fatal = check.fatal || null;

    // 轮询等战斗真正开始（要先加载图集）
    let skip = null;
    for (let i = 0; i < 40 && !skip; i++) { await wait(100); skip = document.querySelector('[aria-label="跳过战斗"]'); }
    check.beforeSkip = snap('before-skip');
    check.skipFound = !!skip;
    const doSkip = !/[?&]skip=0/.test(location.search);
    check.doSkip = doSkip;
    if (skip && doSkip) {
      await wait(delay);
      check.beforeClick = snap('before-click');
      skip.click();
      await wait(2500);
    } else {
      // 不跳过：等结算弹窗出现（最多 90 秒）
      for (let i = 0; i < 900; i++) {
        await wait(100);
        if (document.querySelector('.classic-modal-overlay')) break;
      }
      await wait(600);
    }
    check.afterSkip = snap('after-end');

    check.errs = window.__errs;
    check.logs = window.__logs;
    window.__report = { check, errs: window.__errs };
    document.title = 'READY';
  });
})();
</script>
</body>
</html>

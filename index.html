<!DOCTYPE html>

<script>
// 运行时错误收集（供自检模式 ?test=1 报告问题，不影响正常游戏）
window.__errs = [];
window.addEventListener('error', function (e) {
  window.__errs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0));
});
window.addEventListener('unhandledrejection', function (e) {
  window.__errs.push('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
});
</script>
</head>

<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui"></div>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="../../../">
<meta charset="UTF-8">
<title>调试面板快速获取物品检查</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/classic.css">
<link rel="stylesheet" href="css/classic-extras.css">
<link rel="stylesheet" href="css/classic-fusion.css">
<link rel="stylesheet" href="css/debug.css">
<link rel="stylesheet" href="css/battle-drops.css">
<link rel="stylesheet" href="css/classic-refine.css">
<script>
window.__errs = [];
window.addEventListener('error', function (e) { window.__errs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0)); });
window.addEventListener('unhandledrejection', function (e) { window.__errs.push('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
</script>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <div id="boot-note">初始化…</div>
</div>
<script src="js/orig/Map.min.js"></script>
<script src="js/orig/GameDict.js"></script>
<script src="js/orig/animationStr.js"></script>
<script src="js/orig/assets.js"></script>
<script src="js/orig/asset2.js"></script>
<script src="js/engine.js"></script>
<script src="js/gamedata.js"></script>
<script src="js/state.js"></script>
<script src="js/sim.js"></script>
<script src="js/battle-drops.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/classic-ui.js"></script>
<script src="js/classic-extras.js"></script>
<script src="js/classic-fusion.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
<script>
/* 1) 调试面板的「快速获取物品」下拉是否列全、点击是否真的进背包
 * 2) 天梯商店（金杯商店）是否每天都能打开、限兑是否按天重置
 * 结果在 window.__report.check。 */
(function () {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  window.addEventListener('load', async () => {
    document.title = 'LOADING';
    localStorage.removeItem('ssdz_debug');
    await wait(250);
    State.newGame('获取检查');
    const S = State.state();
    S.level = 32; S.goldCup = 9000; S.goldPoint = 9000; S.integral = 9000;
    State.save();
    Main.showHome();
    await wait(400);
    const check = {};

    // ---------- 调试面板 ----------
    Debug.open();
    await wait(200);
    const panel = document.querySelector('.debug-panel');
    const select = panel.querySelector('[data-item-select]');
    const countInput = panel.querySelector('[data-item-count]');
    const grantBtn = panel.querySelector('[data-item-grant]');
    check.panel = {
      opened: panel.classList.contains('open'),
      optionCount: select ? select.options.length : 0,
      hasFragment: !!(select && select.querySelector('option[value="24"]')),
      hasSeed: !!(select && select.querySelector('option[value="45"]')),
      hasShard: !!(select && select.querySelector('option[value="51"]')),
      defaultCount: countInput ? countInput.value : null,
    };
    select.value = '51'; countInput.value = '7';
    grantBtn.click();
    await wait(150);
    check.grantShard = { props51: S.props[51] || 0, msg: panel.querySelector('.debug-msg').textContent };
    // 再点一次应累加
    grantBtn.click();
    await wait(150);
    check.grantAgain = { props51: S.props[51] || 0 };
    // 负数/超上限应被夹住
    countInput.value = '5000';
    select.value = '1';
    grantBtn.click();
    await wait(150);
    check.clamp = { props1: S.props[1] || 0 };
    // 直接调 API（测试脚本常用）
    check.api = Debug.grantItem(2, 3);

    // ---------- 天梯商店 ----------
    const RealNow = Date.now;
    const dayAt = (dow) => { const d = new Date('2026-03-01T10:00:00'); while (d.getDay() !== dow) d.setDate(d.getDate() + 1); return d; };
    const monday = dayAt(1), sunday = dayAt(0);
    const setNow = (d) => { Date.now = () => d.getTime(); };
    const alerts = [];
    const realAlert = window.alert;
    window.alert = (m) => alerts.push(String(m));
    const shopPage = () => document.querySelector('.classic-page[data-screen="shop"]');
    const goodsBtn = (id) => document.querySelector('[data-goods="' + id + '"]');

    setNow(sunday);
    ClassicExtras.rankShop();
    await wait(150);
    check.sundayOpen = { page: !!shopPage(), alerts: alerts.slice() };

    alerts.length = 0;
    setNow(monday);
    State.state().rankPurchaseDay = '';
    ClassicExtras.rankShop();
    await wait(150);
    check.mondayOpen = { page: !!shopPage(), alerts: alerts.slice(), note: (document.querySelector('.extra-board') || {}).textContent };

    // 限兑：5 号（每日限兑 1 次）
    check.limitText = goodsBtn(5) ? goodsBtn(5).querySelector('small').textContent : null;
    // 被拒绝时游戏弹的是「知道了」提示框（不是原生 alert），所以读弹窗正文
    const noticeText = () => {
      const ms = document.querySelectorAll('.classic-modal-overlay');
      const m = ms[ms.length - 1];
      return m ? m.querySelector('.modal-body').textContent.trim().replace(/\s+/g, ' ') : '';
    };
    const buy = async () => {
      document.querySelectorAll('.classic-modal-overlay').forEach((e) => e.remove());
      const before = State.state().rankPurchases['5'] || 0;
      const btn = goodsBtn(5);
      if (!btn) return 'no-button';
      btn.click();
      await wait(120);
      const ok = document.querySelector('.classic-modal-overlay .modal-buttons button');
      if (!ok) return 'no-confirm';
      const label = ok.textContent.trim();
      ok.click();
      await wait(220);
      const after = State.state().rankPurchases['5'] || 0;
      const tip = noticeText();
      return label + ' | 已兑 ' + before + '→' + after + (tip ? ' | 提示：' + tip : '');
    };
    check.buy1 = await buy();
    check.buy2 = await buy();
    check.buy3 = await buy();

    // 换一天：限兑应该重置
    State.state().rankPurchaseDay = '2000-01-01';
    ClassicExtras.rankShop();
    await wait(150);
    check.nextDay = { cleared: Object.keys(State.state().rankPurchases).length, text: goodsBtn(5) ? goodsBtn(5).querySelector('small').textContent : null };
    check.buyNextDay = await buy();
    check.autoBuy = await buy();
    document.querySelectorAll('.classic-modal-overlay').forEach((e) => e.remove());

    window.alert = realAlert;
    Date.now = RealNow;
    check.errs = window.__errs;
    window.__report = { check, errs: window.__errs };
    document.title = 'READY';
  });
})();
</script>
</body>
</html>

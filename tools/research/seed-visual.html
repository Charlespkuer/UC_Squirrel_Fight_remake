<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="../../">
<meta charset="UTF-8">
<title>天使种子详情外观</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/classic.css">
<link rel="stylesheet" href="css/classic-extras.css">
<link rel="stylesheet" href="css/classic-fusion.css">
<link rel="stylesheet" href="css/debug.css">
<link rel="stylesheet" href="css/battle-drops.css">
<link rel="stylesheet" href="css/classic-refine.css">
<script>
window.__errs = [];
window.addEventListener('error', function (e) { window.__errs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0)); });
</script>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <div id="boot-note">初始化…</div>
</div>
<script src="js/orig/Map.min.js"></script>
<script src="js/orig/GameDict.js"></script>
<script src="js/orig/animationStr.js"></script>
<script src="js/orig/assets.js"></script>
<script src="js/orig/asset2.js"></script>
<script src="js/engine.js"></script>
<script src="js/gamedata.js"></script>
<script src="js/state.js"></script>
<script src="js/sim.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/classic-ui.js"></script>
<script src="js/classic-extras.js"></script>
<script src="js/classic-fusion.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
<script>
/* 外观检查：?full=1 已满 / 否则未满。只走一次干净的点击路径，停在天使种子详情弹窗上供截图。 */
(function () {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const full = /[?&]full=1/.test(location.search);
  const seed = (location.search.match(/[?&]seed=(\d+)/) || [, '45'])[1];
  window.addEventListener('load', async () => {
    document.title = 'LOADING';
    localStorage.removeItem('ssdz_debug');
    await wait(250);
    State.newGame('种子外观');
    const S = State.state();
    S.level = 20; S.goldPoint = 500; S.energy = S.maxEnergy;
    S.props = { 45: 20, 46: 20 };
    S.weapons = []; S.skills = [];
    let id = 2;
    const n = full ? State.wsLimit() : 1;
    for (let i = 0; i < n; i++) {
      if (i % 2 === 0) S.weapons.push(id + ':3'); else S.skills.push(id + ':3');
      if (i % 2 === 1) id++;
    }
    State.save();
    Main.showHome();
    await wait(400);
    UI.runAction('bag');
    await wait(300);
    const cell = document.querySelector('[data-prop="' + seed + '"]');
    cell.click();
    await wait(300);
    document.querySelector('[data-action="prop-action"]').click();
    await wait(400);
    window.__report = {
      errs: window.__errs,
      full: full,
      ws: S.weapons.length + S.skills.length,
      limit: State.wsLimit(),
      text: (document.querySelector('.classic-modal-overlay:last-of-type') || document.body).textContent.replace(/\s+/g, ' ').trim(),
    };
    document.title = 'READY';
  });
})();
</script>
</body>
</html>

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 显示环境
        shell: bash
        run: node -v && npm -v && uname -a || true

      # 资源引用大小写/断链体检：Windows 与 macOS 不区分大小写，
      # 只有在这里（Linux 也跑一遍）才能拦住「本机能跑、发布后 404」的问题
      - name: 资源路径体检
        shell: bash
        run: node tools/check-asset-paths.cjs

      - name: 单元与集成测试
        shell: bash
        run: |
          for t in test-state test-balance test-points test-combat-rules test-battle-drops \
                   test-main-battle test-extras test-fusion test-stages test-stage-balance; do
            echo "──── $t ────"
            node "tools/$t.cjs"
          done

      # 动画回归需要可选依赖 @napi-rs/canvas（三个平台都有预编译包）；装不上就自动 SKIP
      - name: 动画回归（可选依赖）
        shell: bash
        continue-on-error: true
        run: |
          npm install --no-save --package-lock=false @napi-rs/canvas
          node tools/test-battle.js

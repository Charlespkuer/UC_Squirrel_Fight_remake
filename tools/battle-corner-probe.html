<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="/">
<!-- 本轮改动验证探针（开发用，不属于游戏本体）。
     用法：node scripts/serve.js --no-save 8199
           打开 http://127.0.0.1:8199/tools/battle-corner-probe.html
     用途：把战斗画面停在开局，检查右下角「倍速 / 跳过」两个键的排布。
     参数：?mode=both（默认）/ speed（只有倍速）/ skip（只有跳过）
     诊断 JSON 塞进隐藏的 <pre id="probe-json">，可用 headless Chrome --dump-dom 抓取。 -->
<meta charset="UTF-8">
<title>战斗右下角按钮探针（开发用）</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/classic.css">
<link rel="stylesheet" href="css/classic-extras.css">
<link rel="stylesheet" href="css/classic-fusion.css">
<link rel="stylesheet" href="css/debug.css">
<link rel="stylesheet" href="css/battle-drops.css">
<link rel="stylesheet" href="css/classic-refine.css">
<link rel="stylesheet" href="css/tower.css">
<style>body{margin:0;background:#17263f}#stage{display:block;width:1170px;height:690px}</style>
</head>
<body>
<div id="app">
  <canvas id="stage" width="1170" height="690"></canvas>
  <div id="ui"></div>
</div>
<script src="js/gamedict.js"></script>
<script src="js/engine.js"></script>
<script src="js/gamedata.js"></script>
<script src="js/state.js"></script>
<script src="js/sim.js"></script>
<script src="js/battle.js"></script>
<script>
(function () {
  'use strict';
  const q = new URL(location.href).searchParams;
  const mode = q.get('mode') || 'both';
  const speedToggle = mode === 'both' || mode === 'speed';
  const allowSkip = mode === 'both' || mode === 'skip';
  const canvas = document.getElementById('stage');
  const gear = (id) => ({ id: id, level: 1 });
  const me = {
    name: '小松鼠', level: 60, power: 200, agility: 150, speed: 150, hp: 9000, maxHp: 9000,
    baseStats: { power: 200, agility: 150, speed: 150 },
    weapons: [{ id: 6, level: 5 }, { id: 3, level: 5 }], skills: [{ id: 12, level: 5 }],
    wears: [], effects: {}, masterLevel: 0,
  };
  const foe = {
    name: '测试对手', level: 60, power: 180, agility: 120, speed: 120, hp: 9000, maxHp: 9000,
    baseStats: { power: 180, agility: 120, speed: 120 },
    weapons: [{ id: 8, level: 5 }], skills: [], wears: [], effects: {},
  };
  window.__probe = { mode: mode, speedToggle: speedToggle, allowSkip: allowSkip, layout: null, dom: [] };
  Battle.run({ canvas: canvas, me: me, foe: foe, region: 0, speedToggle: speedToggle, allowSkip: allowSkip, collectDrops: false })
    .then(function () {
      window.__probe.layout = Battle._cornerLayout(speedToggle, allowSkip);
      window.__probe.dom = Array.prototype.map.call(document.querySelectorAll('#ui button'), function (b) {
        return { label: b.textContent, aria: b.getAttribute('aria-label'), style: b.style.cssText };
      });
      const pre = document.createElement('pre');
      pre.id = 'probe-json';
      pre.style.display = 'none';
      pre.textContent = JSON.stringify(window.__probe);
      document.body.appendChild(pre);
    })
    .catch(function (e) {
      const pre = document.createElement('pre');
      pre.id = 'probe-json';
      pre.style.display = 'none';
      pre.textContent = JSON.stringify({ error: String(e && (e.stack || e.message || e)) });
      document.body.appendChild(pre);
    });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="../../">
<meta charset="UTF-8">
<title>装备融合外观检查</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/classic.css">
<link rel="stylesheet" href="css/classic-extras.css">
<link rel="stylesheet" href="css/classic-fusion.css">
<link rel="stylesheet" href="css/debug.css">
<link rel="stylesheet" href="css/battle-drops.css">
<link rel="stylesheet" href="css/classic-refine.css">
<script>
window.__errs = [];
window.addEventListener('error', function (e) { window.__errs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0)); });
window.addEventListener('unhandledrejection', function (e) { window.__errs.push('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
</script>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <div id="boot-note">初始化…</div>
</div>
<script src="js/orig/Map.min.js"></script>
<script src="js/orig/GameDict.js"></script>
<script src="js/orig/animationStr.js"></script>
<script src="js/orig/assets.js"></script>
<script src="js/orig/asset2.js"></script>
<script src="js/engine.js"></script>
<script src="js/gamedata.js"></script>
<script src="js/state.js"></script>
<script src="js/sim.js"></script>
<script src="js/battle-drops.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/classic-ui.js"></script>
<script src="js/classic-extras.js"></script>
<script src="js/classic-fusion.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
<script>
/* 装备融合页外观：默认 3 件蓝色同级装备 + 1 件紫色，用来检查材料槽/预览/按钮。
 * ?empty=1 只给 1 件，检查「材料不足」状态。 */
(function () {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const q = new URLSearchParams(location.search);
  window.addEventListener('load', async () => {
    document.title = 'LOADING';
    localStorage.removeItem('ssdz_debug');
    await wait(250);
    State.newGame('融合检查');
    const S = State.state();
    S.level = 40; S.goldPoint = 2000;
    // 品质由套装决定：1~8 白、9~20 绿、21~48 蓝、49+ 紫。
    // 给 4 件不同的蓝色装备 + 1 件紫色，既能看网格也能触发「需要相同装备」。
    const ids = q.get('empty') === '1' ? [21] : [21, 21, 21, 22, 23, 49];
    for (const id of ids) { try { State.addGear(id, []); } catch (e) {} }
    check_ids: { /* 上面已经放入装备，这里不再使用 gearMap 查询 */ }
    State.save();
    Main.showHome();
    await wait(500);
    ClassicFusion.open();
    await wait(500);

    // ?select=3 自动放入 3 件相同材料，便于截图检查「材料已齐全」状态
    const want = Number(q.get('select') || 0);
    for (let i = 0; i < want; i++) {
      const next = [...document.querySelectorAll('[data-fusion-gear]')].find((b) => !b.disabled && !b.classList.contains('selected'));
      if (!next) break;
      next.click();
      await wait(120);
    }
    await wait(200);

    const check = {};
    const board = document.querySelector('.fusion-board');
    check.hasBoard = !!board;
    check.materials = document.querySelectorAll('.fusion-material').length;
    check.filled = document.querySelectorAll('.fusion-material.filled').length;
    check.listItems = document.querySelectorAll('.fusion-gear').length;
    check.hasPreview = !!document.querySelector('.fusion-preview');
    check.fuseText = (document.querySelector('[data-fusion-action="fuse"]') || {}).textContent || null;
    check.hint = (document.querySelector('.fusion-hint') || document.querySelector('.fusion-cost') || {}).textContent || null;
    check.errs = window.__errs;
    window.__report = { check, errs: window.__errs };
    document.title = 'READY';
  });
})();
</script>
</body>
</html>

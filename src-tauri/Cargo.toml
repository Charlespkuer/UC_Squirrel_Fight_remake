[package]
name = "ssdz-classic"
version = "0.1.3"
description = "松鼠大战 怀旧复刻版 —— 轻量桌面窗口（自带迷你文件服务器，直接用游戏目录里的前端）"
authors = ["ssdz-classic"]
edition = "2021"
rust-version = "1.77"

# 两个产物，同一个 crate：
#   * bin  squirrel_fight   → 桌面 exe（几 MB 的轻壳，前端在游戏目录里）
#     注意：**包名仍是 ssdz-classic**（`[package] name` 不动），只把可执行文件名改成
#     squirrel_fight；因为 Tauri 打包器默认按包名找二进制，所以 tauri.conf.json 里
#     必须同时设 "mainBinaryName": "squirrel_fight"。
#   * lib  ssdz_classic_lib → Android/iOS 用（移动端把前端嵌进安装包，
#     由 tauri::mobile_entry_point 生成 JNI 入口；lib.rs 里按 cfg(mobile) 分支）
#     安卓侧加载的是 libssdz_classic_lib.so，**这个名字不要动**（改了要同步改
#     gen/android 里的 jniLibs 与 gradle 配置）。
[[bin]]
name = "squirrel_fight"
path = "src/main.rs"

[lib]
name = "ssdz_classic_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 前端不嵌进二进制（只放一个几百字节的提示页），所以关掉 tauri 的压缩特性，
# 这样 exe 只有几 MB；需要压缩的只有安装包模式，那条路由 tauri.bundle.conf.json 负责。
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "compression"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

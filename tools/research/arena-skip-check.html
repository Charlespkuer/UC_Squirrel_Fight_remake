<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="/">
<meta charset="UTF-8">
<title>竞技场跳过与背景检查</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/classic.css">
<link rel="stylesheet" href="css/classic-extras.css">
<link rel="stylesheet" href="css/classic-fusion.css">
<link rel="stylesheet" href="css/debug.css">
<link rel="stylesheet" href="css/battle-drops.css">
<link rel="stylesheet" href="css/classic-refine.css">
<script>
window.__errs = [];
window.__logs = [];
window.addEventListener('error', function (e) { window.__errs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0)); });
window.addEventListener('unhandledrejection', function (e) { window.__errs.push('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
(function () { const ce = console.error; console.error = function () { window.__logs.push([].slice.call(arguments).map(String).join(' ').slice(0, 300)); ce.apply(console, arguments); }; })();
</script>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <div id="boot-note">初始化…</div>
</div>
<script src="js/orig/Map.min.js"></script>
<script src="js/orig/GameDict.js"></script>
<script src="js/orig/animationStr.js"></script>
<script src="js/orig/assets.js"></script>
<script src="js/orig/asset2.js"></script>
<script src="js/engine.js"></script>
<script src="js/gamedata.js"></script>
<script src="js/state.js"></script>
<script src="js/sim.js"></script>
<script src="js/battle-drops.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/classic-ui.js"></script>
<script src="js/classic-extras.js"></script>
<script src="js/classic-fusion.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
<script>
/* 真跑竞技场（不桩 Main.startBattle）：报名 → 跳过半决赛 → 跳过第二场 → 看结算。
 * 结果在 window.__report.check。 */
(function () {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  window.addEventListener('load', async () => {
    document.title = 'LOADING';
    localStorage.removeItem('ssdz_debug');
    await wait(250);
    State.newGame('竞技场检查');
    const S = State.state();
    S.level = 22; S.power = 60; S.agility = 60; S.speed = 60; S.maxHp = 6000;
    S.energy = S.maxEnergy; S.props[23] = 20;
    S.weapons = ['1:6', '4:6']; S.skills = [];
    State.save();
    Main.showHome();
    await wait(400);

    const check = { steps: [] };
    const snap = (tag) => {
      const overlays = document.querySelectorAll('.classic-modal-overlay');
      const last = overlays[overlays.length - 1];
      return {
        tag, screen: UI.currentScreen(),
        hasSkip: !!document.querySelector('[aria-label="跳过战斗"]'),
        modal: last ? (last.querySelector('.modal-title') ? last.querySelector('.modal-title').textContent.trim() : null) : null,
        text: last ? last.textContent.replace(/\s+/g, ' ').trim().slice(0, 130) : null,
      };
    };
    const waitSkip = async () => { for (let i = 0; i < 60; i++) { await wait(100); if (document.querySelector('[aria-label="跳过战斗"]')) return true; } return false; };
    const skipNow = async () => {
      const b = document.querySelector('[aria-label="跳过战斗"]');
      if (b) b.click();
      for (let i = 0; i < 60; i++) { await wait(100); if (document.querySelector('.classic-modal-overlay')) return true; }
      return false;
    };

    ClassicExtras.arena();
    await wait(300);
    document.querySelector('[data-action="arena-exp"]').click();
    await wait(300);
    check.steps.push(snap('confirm'));
    document.querySelector('.classic-modal-overlay [data-action="0"]').click();
    await wait(300);

    // 第一场（半决赛）
    check.semiStarted = await waitSkip();
    await skipNow();
    check.steps.push(snap('after-semi'));

    // 第二场（决赛）
    const next = document.querySelector('.classic-modal-overlay [data-action="0"]');
    if (next) next.click();
    check.finalStarted = await waitSkip();
    await skipNow();
    await wait(600);
    check.steps.push(snap('after-final'));

    check.errs = window.__errs;
    check.logs = window.__logs;
    window.__report = { check, errs: window.__errs };
    document.title = 'READY';
  });
})();
</script>
</body>
</html>

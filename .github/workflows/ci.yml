name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 显示环境
        shell: bash
        run: node -v && npm -v && uname -a || true

      # 资源引用大小写/断链体检：Windows 与 macOS 不区分大小写，
      # 只有在这里（Linux 也跑一遍）才能拦住「本机能跑、发布后 404」的问题
      - name: 资源路径体检
        shell: bash
        run: node tools/check-asset-paths.cjs

      # 编码体检：.ps1 含中文必须有 UTF-8 BOM（Windows PowerShell 5.1 对无 BOM 的文件按 ANSI 解码，
      # 中文会乱码、甚至把注释块拆坏导致整脚本解析失败 —— 2026-10 真踩过：打包脚本因此红了 27 个语法错）；
      # 顺带查所有文本文件是不是合法 UTF-8（以前出过 PowerShell 写回 GBK 把源码写坏的事）。
      - name: 编码体检
        shell: bash
        run: node tools/check-encodings.cjs

      - name: 单元与集成测试
        shell: bash
        run: |
          # 并行入口：枚举 tools/test-*.cjs，长套件先跑；失败时打印最后 25 行并写
          # `::error::` 注解 + job summary（远程排查不用 admin 权限）。
          node tools/run-tests.cjs --jobs 4

      # 检出的行尾也要报出来：Git for Windows 默认 core.autocrlf=true，
      # 一旦检出成 CRLF，「切行 + /^\s*\}$/ 锚定正则」那类文本断言就会全空
      # （曾经就是 Windows 专属红灯的根因）。
      - name: 行尾体检
        shell: bash
        run: |
          node -e "const b=require('fs').readFileSync('js/tower-ui.js');console.log('js/tower-ui.js CRLF:', b.includes(Buffer.from('\r\n')))"

      # 动画回归需要可选依赖 @napi-rs/canvas（三个平台都有预编译包）；装不上就自动 SKIP。
      # npm 缓存：这是 CI 里唯一的网络下载，命中时基本是本地解包。
      - name: 缓存 npm（@napi-rs/canvas）
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-canvas-${{ runner.os }}-v1
      - name: 动画回归（可选依赖）
        shell: bash
        continue-on-error: true
        run: |
          npm install --no-save --package-lock=false --prefer-offline @napi-rs/canvas
          node tools/test-battle.js

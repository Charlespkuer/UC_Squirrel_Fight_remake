<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="../../">
<meta charset="UTF-8">
<title>经验丸说明检查</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/classic.css">
<link rel="stylesheet" href="css/classic-extras.css">
<link rel="stylesheet" href="css/classic-fusion.css">
<link rel="stylesheet" href="css/debug.css">
<link rel="stylesheet" href="css/battle-drops.css">
<link rel="stylesheet" href="css/classic-refine.css">
<script>
window.__errs = [];
window.addEventListener('error', function (e) { window.__errs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0)); });
</script>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <div id="boot-note">初始化…</div>
</div>
<script src="js/orig/Map.min.js"></script>
<script src="js/orig/GameDict.js"></script>
<script src="js/orig/animationStr.js"></script>
<script src="js/orig/assets.js"></script>
<script src="js/orig/asset2.js"></script>
<script src="js/engine.js"></script>
<script src="js/gamedata.js"></script>
<script src="js/state.js"></script>
<script src="js/sim.js"></script>
<script src="js/battle-drops.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/classic-ui.js"></script>
<script src="js/classic-extras.js"></script>
<script src="js/classic-fusion.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
<script>
/* 走真实界面核对经验丸/超级经验丸的说明文案：背包详情、商店、帮助图鉴、背包列表。 */
(function () {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  window.addEventListener('load', async () => {
    document.title = 'LOADING';
    localStorage.removeItem('ssdz_debug');
    await wait(250);
    State.newGame('说明检查');
    const S = State.state();
    S.level = 20; S.props[7] = 5; S.props[44] = 5;
    State.save();
    Main.showHome();
    await wait(400);

    const check = {};
    const overlayText = () => {
      const ms = document.querySelectorAll('.classic-modal-overlay');
      const m = ms[ms.length - 1];
      return m ? m.textContent.replace(/\s+/g, ' ').trim() : null;
    };
    const openProp = async (id, shop) => {
      document.querySelectorAll('.classic-modal-overlay').forEach((e) => e.remove());
      UI.runAction(shop ? 'shop' : 'bag');
      await wait(250);
      const cell = document.querySelector('[data-prop="' + id + '"]');
      if (!cell) return { error: 'no-cell-' + id };
      cell.click();
      await wait(250);
      const act = document.querySelector('[data-action="prop-action"]');
      if (!act) return { error: 'no-action-' + id };
      act.click();
      await wait(300);
      return { text: overlayText() };
    };

    check.data7 = propMap.getValue(7).remark;
    check.data44 = propMap.getValue(44).remark;
    check.bag7 = await openProp(7, false);
    if (/[?&]shot=1/.test(location.search)) {
      window.__report = { check, errs: window.__errs };
      document.title = 'READY';
      return;
    }
    check.bag44 = await openProp(44, false);
    check.shop7 = await openProp(7, true);
    check.shop44 = await openProp(44, true);

    // 帮助/图鉴页的道具说明
    document.querySelectorAll('.classic-modal-overlay').forEach((e) => e.remove());
    UI.runAction('help');
    await wait(300);
    const helpText = (document.querySelector('#ui') || document.body).textContent;
    check.helpMentionsPill = /经验丸/.test(helpText);

    const all = [check.bag7.text, check.bag44.text, check.shop7.text, check.shop44.text].filter(Boolean).join(' | ');
    check.anyMentionsArena = /竞技场中无效|竞技,天梯|,竞技/.test(all);
    check.errs = window.__errs;
    window.__report = { check, errs: window.__errs };
    document.title = 'READY';
  });
})();
</script>
</body>
</html>

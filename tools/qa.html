<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="../">
<!-- Developer QA only: this page always uses the isolated test save. -->
<script>
(function () {
  const url = new URL(location.href);
  url.searchParams.set('qa', '1');
  url.searchParams.delete('test');
  history.replaceState(null, '', url.href);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>松鼠大战 · 开发测试页面</title>
<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/debug.css">
<link rel="stylesheet" href="css/battle-drops.css">
<link rel="stylesheet" href="css/classic-refine.css">
<script>
// 运行时错误收集（供自检模式 ?test=1 报告问题，不影响正常游戏）
window.__errs = [];
window.addEventListener('error', function (e) {
  window.__errs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0));
});
window.addEventListener('unhandledrejection', function (e) {
  window.__errs.push('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
});
</script>
</head>
<body>
<aside id="qa-label" style="position:fixed;right:7px;top:5px;z-index:9999;padding:3px 9px;border-radius:8px;background:#172319cf;color:#fff4cc;font:12px/1.5 sans-serif;pointer-events:none" title="仅供开发测试。使用独立测试存档，每次刷新重置测试角色；正式游戏存档不受影响。">QA · 独立测试存档 · 刷新重置</aside>

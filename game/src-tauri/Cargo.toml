[package]
name = "ssdz-classic"
version = "0.1.3"
description = "松鼠大战 怀旧复刻版 —— 轻量桌面窗口（自带迷你文件服务器，直接用游戏目录里的前端）"
authors = ["ssdz-classic"]
edition = "2021"
rust-version = "1.77"

# 只有可执行文件：不再产出 lib/dll（少一个文件，产物更干净）
[[bin]]
name = "ssdz-classic"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 前端不嵌进二进制（只放一个几百字节的提示页），所以关掉 tauri 的压缩特性，
# 这样 exe 只有几 MB；需要压缩的只有安装包模式，那条路由 tauri.bundle.conf.json 负责。
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "compression"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
